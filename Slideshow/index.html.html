<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow CSS Animaciones</title>
 
    <style>
    @font-face {
       font-family: 'Narnia';
       src: url('fonts/Narnia-Regular.ttf') format('truetype');
       font-weight: 300;
       font-style: normal;
    }
    h1{
         font-family: 'Narnia';
        text-align: center;
        margin-top: 0px;
        margin-bottom: 50px;
        font-size:90px ;
    }
        #slideshow {
            text-align: center;
            overflow: hidden;
            height: 510px;
            width: 728px;
            margin: auto;
        }
 
        .slide-wrapper {
            width: 3640px;
            animation: slide 15s infinite ease-in-out;
        }
 
        .imgUno,
        .imgDos,
        .imgTres,
        .imgCuatro,
        .imgCinco {
            float: left;
            height: 510px;
            width: 728px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
        }
 
        .imgUno {
            background-color: rgb(127, 203, 250);
        }
 
        .imgDos {
            background-color: rgb(241, 255, 90);
        }
 
        .imgTres {
            background-color: rgb(224, 101, 229);
        }
 
        .imgCuatro {
            background-color: rgb(170, 224, 123);
        }
 
        .imgCinco {
            background-color: rgb(206, 95, 134);
        }
 
        @keyframes slide {
            0%, 15% {
                margin-left: 0;
            }
 
            20%, 35% {
                margin-left: -728px;
            }
 
            40%, 55% {
                margin-left: -1456px;
            }
 
            60%, 75% {
                margin-left: -2184px;
            }
 
            80%, 100% {
                margin-left: -2912px;
            }
        }
 
        .boton {
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: rgb(11, 57, 156);
            color: white;
            text-decoration: none;
            border-radius: 5px;
           margin-left: 670px;
        }
 
        .boton:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>
 
    <h1>Carrusel</h1>
 
    <div id="slideshow">
        <div class="slide-wrapper">
 
            <div class="imgUno">
                <h1>1</h1>
            </div>
 
            <div class="imgDos">
                <h1>2</h1>
            </div>
 
            <div class="imgTres">
                <h1>3</h1>
            </div>
 
            <div class="imgCuatro">
                <h1>4</h1>
            </div>
 
            <div class="imgCinco">
                <h1>5</h1>
            </div>
 
        </div>
    </div>
 
    <a  class="boton"  href="..index.html.html">Ir a principal</a>
 
</body>
</html>
